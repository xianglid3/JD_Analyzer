<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JD Translator - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#b6b4ff",
                        "inverse-primary": "#c3c0ff",
                        "secondary-fixed-dim": "#c3c0ff",
                        "on-secondary-container": "#454386",
                        "surface-bright": "#f8f9ff",
                        "tertiary-fixed-dim": "#ffb695",
                        "outline": "#777587",
                        "secondary-fixed": "#e2dfff",
                        "surface": "#f8f9ff",
                        "on-error-container": "#93000a",
                        "background": "#f8f9ff",
                        "primary": "#3525cd",
                        "on-surface-variant": "#464555",
                        "inverse-surface": "#273140",
                        "on-secondary": "#ffffff",
                        "on-background": "#121c2a",
                        "on-error": "#ffffff",
                        "surface-dim": "#d0daee",
                        "on-secondary-fixed": "#140f54",
                        "surface-container-low": "#eff3ff",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#351000",
                        "primary-fixed-dim": "#c3c0ff",
                        "primary-container": "#4f46e5",
                        "tertiary": "#7e3000",
                        "inverse-on-surface": "#ebf1ff",
                        "secondary": "#58579b",
                        "outline-variant": "#c7c4d8",
                        "on-secondary-fixed-variant": "#413f82",
                        "on-primary-container": "#dad7ff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#3323cc",
                        "surface-tint": "#4d44e3",
                        "surface-container": "#e6eeff",
                        "primary-fixed": "#e2dfff",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#d9e3f7",
                        "surface-variant": "#d9e3f7",
                        "on-surface": "#121c2a",
                        "tertiary-fixed": "#ffdbcc",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#0f0069",
                        "surface-container-high": "#dfe9fc",
                        "on-tertiary-container": "#ffd2be",
                        "tertiary-container": "#a44100"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "base": "4px",
                        "sm": "12px",
                        "gutter": "24px",
                        "xs": "8px",
                        "xxl": "48px",
                        "xl": "32px",
                        "md": "16px",
                        "margin": "32px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "display": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f7f8fa; /* Light-gray surface from design guidance */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-body-md text-on-surface antialiased p-margin">
<div class="w-full max-w-[400px] bg-surface-container-lowest border border-[#e5e7eb] rounded-lg p-xl">
<!-- Brand -->
<div class="text-center mb-xl">
<h1 class="text-primary font-headline-lg text-headline-lg mb-xs">JD Translator</h1>
<p class="font-headline-md text-headline-md text-on-surface">Log in</p>
</div>
<!-- Form -->
<form class="space-y-md">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="username">Username</label>
<input class="w-full px-[12px] py-xs border border-[#e5e7eb] rounded-[8px] font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<input class="w-full px-[12px] py-xs border border-[#e5e7eb] rounded-[8px] font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-sm rounded-DEFAULT hover:opacity-90 transition-opacity mt-xl" type="submit">
                Log in
            </button>
</form>
<!-- Footer Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary hover:underline font-label-md text-label-md ml-1" href="#">Sign up</a>
</p>
</div>
</div>
</body></html>
