<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4">
<!-- Transactional Screen: Navigation explicitly suppressed -->
<div class="bg-surface-container-lowest w-full max-w-md rounded-xl border border-outline-variant p-margin shadow-sm">
<!-- Brand / Header -->
<div class="text-center mb-xl">
<h1 class="text-primary font-headline-md text-headline-md font-bold tracking-tight">JD Translator</h1>
<h2 class="mt-sm text-on-surface font-headline-lg text-headline-lg">Create your account</h2>
<p class="mt-base text-on-surface-variant font-body-md text-body-md">Join to start translating your documents.</p>
</div>
<!-- Form -->
<form class="space-y-md">
<div>
<label class="block text-on-surface font-label-md text-label-md mb-base" for="username">Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full pl-[40px] pr-sm py-sm border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="username" name="username" placeholder="Choose a username" required="" type="text"/>
</div>
</div>
<div>
<label class="block text-on-surface font-label-md text-label-md mb-base" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full pl-[40px] pr-sm py-sm border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="Create a strong password" required="" type="password"/>
</div>
</div>
<!-- Action -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-sm rounded-lg hover:bg-surface-tint transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex justify-center items-center gap-xs" type="submit">
<span>Sign up</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer -->
<div class="mt-xl text-center">
<p class="text-on-surface-variant font-body-md text-body-md">
                Already have an account? 
                <a class="text-primary font-label-md text-label-md hover:underline hover:text-surface-tint transition-colors" href="#">Log in</a>
</p>
</div>
</div>
</body></html>
